services:
  frontend:
    build:
      context: ./frontend
    container_name: blockforge-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: blockforge-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
